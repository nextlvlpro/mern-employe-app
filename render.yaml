services:
  - type: web
    name: bluepeak-hr-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_VERSION
        value: 24
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: bluepeak-hr-client
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: bluepeak-hr-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        fromService:
          type: web
          name: bluepeak-hr-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
